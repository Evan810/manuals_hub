name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze / format / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  backend:
    name: FastAPI smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest tests -q

  asset-integrity:
    name: Asset / DB integrity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: pip install pyyaml pytest

      - name: Run integrity audit (strict)
        working-directory: assets
        run: python audit_assets.py --strict

      - name: Run audit tests
        working-directory: assets
        run: python -m pytest tests -q
